# Single-node local cluster. The denial-scorer Service's NodePort (30080)
# is published on your Mac as http://localhost:8080.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: claimshift
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP