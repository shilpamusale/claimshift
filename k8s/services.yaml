# denial-scorer         all pods (stable + canary): what clients call; on localhost:8080
# denial-scorer-stable  only stable pods  } Argo Rollouts adds a pod-template-hash
# denial-scorer-canary  only canary pods  } to these selectors during a rollout
apiVersion: v1
kind: Service
metadata:
  name: denial-scorer
spec:
  type: NodePort
  selector:
    app: denial-scorer
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: denial-scorer-stable
spec:
  selector:
    app: denial-scorer
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: denial-scorer-canary
spec:
  selector:
    app: denial-scorer
  ports:
    - name: http
      port: 8080
      targetPort: http