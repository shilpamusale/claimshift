data_contract:
  unseen_code_rate:      # share of a tenant's claims with codes not in the training vocabulary
    warn: 0.005
    fail: 0.02
  min_tenant_claims: 500   # smaller tenants are reported but not graded
  psi_icd_chapter:       # population stability index, current window vs training window
    warn: 0.10
    fail: 0.25
  max_null_rate: 0.001
  max_invalid_code_rate: 0.0     # codes must be valid in the code set for their service date

canary:
  parity_max_abs_diff: 1.0e-6   # online vs offline score on the golden set
  max_error_rate: 0.01
  max_p95_latency_ms: 50
  flagged_rate_delta_pts:
    warn: 3
    fail: 8